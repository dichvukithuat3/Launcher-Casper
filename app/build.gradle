plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.liteglass.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'vn.liteglass.launcher'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Ky bang khoa debug de cai truc tiep len TV (sideload)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
