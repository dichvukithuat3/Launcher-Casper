plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.liteglass.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'vn.liteglass.launcher'
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }

    signingConfigs {
        kinh {
            // Khoa ky co dinh: moi ban build sau deu cai de len ban truoc duoc
            storeFile file('kinh-release.jks')
            storePassword 'kinhlauncher'
            keyAlias 'kinh'
            keyPassword 'kinhlauncher'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.kinh
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
