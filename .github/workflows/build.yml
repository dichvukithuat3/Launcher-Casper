name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Package installer
        run: |
          mkdir -p out/KinhLauncher
          cp app/build/outputs/apk/release/app-release.apk out/KinhLauncher/KinhLauncher.apk
          cp tools/*.bat out/KinhLauncher/
          cp tools/HUONG-DAN.txt out/KinhLauncher/
          cd out && zip -r KinhLauncher-goi-cai-dat.zip KinhLauncher

      - uses: actions/upload-artifact@v4
        with:
          name: KinhLauncher
          path: out/KinhLauncher-goi-cai-dat.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kính Launcher (bản ${{ github.run_number }})
          body: Tải file KinhLauncher-goi-cai-dat.zip, giải nén, rồi nháy đúp cai-dat.bat.
          files: |
            out/KinhLauncher-goi-cai-dat.zip
            out/KinhLauncher/KinhLauncher.apk
          make_latest: true
